name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_web:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  validate_electron:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Download Steamworks SDK
        run: |
          aws s3 cp ${{ vars.STEAM_SDK_S3_URI }} .
          tar xzf steamworks_sdk.tar.gz
      - run: npm run build:electron
        env:
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}

  deploy_firebase_preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAKE_A_SET }}
          channelId: preview
          projectId: make-a-set

  build_desktop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build-desktop.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  deploy_steam:
    needs: build_desktop
    uses: ./.github/workflows/deploy-steam.yml
    with:
      build-description: unstable-${{ github.sha }}
      release-branch: prerelease
    secrets: inherit
