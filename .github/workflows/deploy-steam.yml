name: Deploy to Steam

on:
  workflow_call:
    inputs:
      build-description:
        description: Build description shown in Steamworks
        type: string
        required: true
      release-branch:
        description: Beta branch to set live after upload, such as prerelease. Leave empty to upload without setting a branch live. Do not pass default. steamcmd cannot set the default branch live on a released app.
        type: string
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts
            steam
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: steam-windows
          path: builds/windows
      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: steam-linux
          path: builds/linux
      - name: Reject the Steam default branch
        if: inputs.release-branch == 'default'
        run: |
          echo "steamcmd cannot set the default branch live on a released app."
          echo "Leave release-branch empty and set the uploaded build live in Steamworks."
          exit 1
      - name: Upload and set a beta branch live
        if: inputs.release-branch != '' && inputs.release-branch != 'default'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APP_ID }}
          buildDescription: ${{ inputs.build-description }}
          rootPath: builds
          depot1Path: windows
          depot2Path: linux
          depot2InstallScriptPath: steam/install_script_linux.vdf
          releaseBranch: ${{ inputs.release-branch }}
      - name: Upload without setting a branch live
        if: inputs.release-branch == ''
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          BUILD_DESCRIPTION: ${{ inputs.build-description }}
        run: bash .github/scripts/upload-steam-build.sh
