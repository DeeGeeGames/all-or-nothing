name: Release on tag
on:
  push:
    tags:
      - 'v*'

jobs:
  build_web:
    strategy:
      matrix:
        include:
          - artifact_name: web-dist
            vite_base: '/'
          - artifact_name: web-dist-itchio
            vite_base: './'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync package.json version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
        env:
          VITE_BASE: ${{ matrix.vite_base }}
          VITE_GOOGLE_ANALYTICS_ID: ${{ matrix.artifact_name == 'web-dist' && secrets.GOOGLE_ANALYTICS_ID || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/web

  deploy_firebase:
    needs: build_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist/web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAKE_A_SET }}
          channelId: live
          projectId: make-a-set

  build_desktop:
    uses: ./.github/workflows/build-desktop.yml
    permissions:
      id-token: write
      contents: read
    with:
      version: ${{ github.ref_name }}
      is-release: true
    secrets: inherit

  create_release:
    needs: build_desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  deploy_itchio:
    needs: [build_web, build_desktop]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist-itchio
          path: web
      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: desktop-linux
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows
          path: desktop-windows

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push web build
        run: ./butler push web deegeegames/all-or-nothing:html5 --userversion "${{ github.ref_name }}"
      - name: Push Linux AppImage build
        run: ./butler push desktop-linux/*.AppImage deegeegames/all-or-nothing:linux --userversion "${{ github.ref_name }}"
      - name: Push Linux Flatpak build
        run: ./butler push desktop-linux/*.flatpak deegeegames/all-or-nothing:linux-flatpak --userversion "${{ github.ref_name }}"
      - name: Push Windows build
        run: ./butler push desktop-windows deegeegames/all-or-nothing:windows --userversion "${{ github.ref_name }}"

  deploy_steam:
    needs: build_desktop
    uses: ./.github/workflows/deploy-steam.yml
    with:
      build-description: ${{ github.ref_name }}
      release-branch: default
    secrets: inherit

  sync_version:
    needs: [deploy_firebase, deploy_itchio, deploy_steam]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Update package.json version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --staged --quiet && echo "package.json already up to date" && exit 0
          git commit -m "chore: sync version to ${GITHUB_REF_NAME} [skip ci]"
          git push origin master
